<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanControl — Escanear</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #111827;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 6px 0; }
    p { color: #9ca3af; font-size: 13px; margin: 0 0 20px 0; }
    #reader {
      max-width: 420px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }
    #estado {
      margin-top: 16px;
      font-size: 13px;
      color: #f59e0b;
      min-height: 18px;
    }
    #botonFlash {
      display: none;
      margin-top: 14px;
      background: #262626;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    #botonFlash:active { transform: scale(0.97); }
    a.volver {
      display: inline-block;
      margin-top: 24px;
      color: #9ca3af;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>🚐 Escanear furgoneta</h2>
  <p>Apunta a la etiqueta del QR</p>

  <div id="reader"></div>
  <div id="estado"></div>

  <button id="botonFlash" onclick="alternarFlash()">🔦 Encender flash</button>

  <a class="volver" href="javascript:void(0)" onclick="window.location.href = URL_APP;">← Abrir VanControl sin escanear</a>

  <script>

    // ⚠️ Sustituye esto por la URL de tu app de Apps Script (la que
    // termina en /exec), la misma que usas para abrir VanControl.
    const URL_APP = "https://script.google.com/macros/s/AKfycbwwkgddPbxxIWXIx2ZP5l-p2HooQFFpD38jIWk7cyZGD6GoWLJvmPA1NKS0LCezd8lq/exec";

    const estado = document.getElementById('estado');

    function alDetectar(textoDecodificado) {
      estado.textContent = 'Código leído, abriendo VanControl...';
      html5QrCode.stop().catch(function() {});
      window.location.href = URL_APP + "?pagina=identificar&vin=" + encodeURIComponent(textoDecodificado);
    }

    const html5QrCode = new Html5Qrcode("reader");

    let torchActivo = false;

    function comprobarFlash() {

      try {

        const capacidades = html5QrCode.getRunningTrackCameraCapabilities();
        const torch = capacidades.torchFeature();

        if (torch.isSupported()) {
          document.getElementById('botonFlash').style.display = 'inline-block';
        }

      } catch (err) {
        // Este dispositivo/navegador no expone control de flash
        // (ej. iPhone, que no lo soporta) — el botón se queda oculto.
      }

    }

    function alternarFlash() {

      try {

        const capacidades = html5QrCode.getRunningTrackCameraCapabilities();
        const torch = capacidades.torchFeature();

        torchActivo = !torchActivo;
        torch.apply(torchActivo);

        document.getElementById('botonFlash').textContent =
          torchActivo ? '🔦 Apagar flash' : '🔦 Encender flash';

      } catch (err) {
        estado.style.color = '#ef4444';
        estado.textContent = 'No se pudo controlar el flash: ' + err;
      }

    }

    // El recuadro se calcula SIEMPRE cuadrado a partir del tamaño real
    // del visor en ese momento (antes era un número fijo y, si el
    // navegador arrancaba la cámara con el visor a medio dimensionar,
    // salía un rectángulo vertical que no leía hasta recargar).
    function calcularQrbox(anchoVisor, altoVisor) {
      const lado = Math.floor(Math.min(anchoVisor, altoVisor) * 0.7);
      const l = Math.max(120, Math.min(lado, 320));
      return { width: l, height: l };
    }

    let arrancando = false;
    let reintentosAuto = 0;

    function arrancar() {

      if (arrancando) return Promise.resolve();
      arrancando = true;

      return html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: calcularQrbox },
        alDetectar,
        function() {
          // "todavía no detecto nada" — se dispara todo el rato
          // mientras se apunta, se ignora a propósito.
        }
      ).then(function() {
        arrancando = false;
        comprobarFlash();
        setTimeout(vigilarRecuadro, 700);
      }).catch(function(err) {
        arrancando = false;
        estado.style.color = '#ef4444';
        estado.textContent = 'No se pudo acceder a la cámara: ' + err;
      });

    }

    function reiniciar() {

      if (arrancando) return;

      let corriendo = false;
      try { corriendo = html5QrCode.getState() === 2; } catch (e) {}

      const parado = corriendo
        ? html5QrCode.stop().catch(function() {})
        : Promise.resolve();

      parado.then(function() {
        document.getElementById('botonFlash').style.display = 'none';
        torchActivo = false;
        document.getElementById('botonFlash').textContent = '🔦 Encender flash';
        return arrancar();
      });

    }

    // Comprueba que el recuadro de lectura es cuadrado; si no lo es
    // (el fallo de antes), reinicia la cámara sola, sin tener que
    // recargar la página. Máximo 3 intentos seguidos para no hacer bucle.
    function vigilarRecuadro() {

      const sombra = document.getElementById('qr-shaded-region');
      if (!sombra) return;

      const cs = window.getComputedStyle(sombra);
      const bx = parseFloat(cs.borderLeftWidth) || 0;
      const by = parseFloat(cs.borderTopWidth) || 0;
      const anchoCaja = sombra.offsetWidth - 2 * bx;
      const altoCaja = sombra.offsetHeight - 2 * by;

      if (Math.abs(anchoCaja - altoCaja) > 6 && reintentosAuto < 3) {
        reintentosAuto++;
        reiniciar();
      } else if (Math.abs(anchoCaja - altoCaja) <= 6) {
        reintentosAuto = 0;
      }

    }

    // Al girar el móvil o cambiar el tamaño, el visor cambia y el
    // recuadro quedaría deformado: se reinicia la cámara.
    let temporizadorResize = null;
    function alCambiarTamano() {
      clearTimeout(temporizadorResize);
      temporizadorResize = setTimeout(function() {
        reintentosAuto = 0;
        reiniciar();
      }, 500);
    }
    window.addEventListener('orientationchange', alCambiarTamano);
    window.addEventListener('resize', alCambiarTamano);

    // Al volver a la pestaña (p. ej. tras bloquear el móvil) la
    // cámara puede haberse quedado parada.
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        let corriendo = false;
        try { corriendo = html5QrCode.getState() === 2; } catch (e) {}
        if (!corriendo) reiniciar();
      }
    });

    // Se arranca cuando la página ya está maquetada del todo.
    function inicio() { setTimeout(arrancar, 250); }
    if (document.readyState === 'complete') inicio();
    else window.addEventListener('load', inicio);

  </script>

</body>
</html>
