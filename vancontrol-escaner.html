<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanControl — Escanear</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #111827;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 6px 0; }
    p { color: #9ca3af; font-size: 13px; margin: 0 0 20px 0; }
    #reader {
      max-width: 420px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }
    #estado {
      margin-top: 16px;
      font-size: 13px;
      color: #f59e0b;
      min-height: 18px;
    }
    #botonFlash {
      display: none;
      margin-top: 14px;
      background: #262626;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    #botonFlash:active { transform: scale(0.97); }
    a.volver {
      display: inline-block;
      margin-top: 24px;
      color: #9ca3af;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>🚐 Escanear furgoneta</h2>
  <p>Apunta a la etiqueta del QR</p>

  <div id="reader"></div>
  <div id="estado"></div>

  <button id="botonFlash" onclick="alternarFlash()">🔦 Encender flash</button>

  <a class="volver" href="https://script.google.com/macros/s/AKfycbw7aqMti_tR63QRDpal60Pf1wkdP9jVG_YXGIiJQfMj1aSA4Xq2Fazn9tTCAimYf5YA/exec">← Abrir VanControl sin escanear</a>

  <script>

    // ⚠️ Sustituye esto por la URL de tu app de Apps Script (la que
    // termina en /exec), la misma que usas para abrir VanControl.
    const URL_APP = "https://script.google.com/macros/s/AKfycbw7aqMti_tR63QRDpal60Pf1wkdP9jVG_YXGIiJQfMj1aSA4Xq2Fazn9tTCAimYf5YA/exec";

    const estado = document.getElementById('estado');

    function alDetectar(textoDecodificado) {
      estado.textContent = 'Código leído, abriendo VanControl...';
      html5QrCode.stop().catch(function() {});
      window.location.href = URL_APP + "?pagina=identificar&vin=" + encodeURIComponent(textoDecodificado);
    }

    const html5QrCode = new Html5Qrcode("reader");

    let torchActivo = false;

    function comprobarFlash() {

      try {

        const capacidades = html5QrCode.getRunningTrackCameraCapabilities();
        const torch = capacidades.torchFeature();

        if (torch.isSupported()) {
          document.getElementById('botonFlash').style.display = 'inline-block';
        }

      } catch (err) {
        // Este dispositivo/navegador no expone control de flash
        // (ej. iPhone, que no lo soporta) — el botón se queda oculto.
      }

    }

    function alternarFlash() {

      try {

        const capacidades = html5QrCode.getRunningTrackCameraCapabilities();
        const torch = capacidades.torchFeature();

        torchActivo = !torchActivo;
        torch.apply(torchActivo);

        document.getElementById('botonFlash').textContent =
          torchActivo ? '🔦 Apagar flash' : '🔦 Encender flash';

      } catch (err) {
        estado.style.color = '#ef4444';
        estado.textContent = 'No se pudo controlar el flash: ' + err;
      }

    }

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 240 },
      alDetectar,
      function() {
        // "todavía no detecto nada" — se dispara todo el rato
        // mientras se apunta, se ignora a propósito.
      }
    ).then(function() {
      comprobarFlash();
    }).catch(function(err) {
      estado.style.color = '#ef4444';
      estado.textContent = 'No se pudo acceder a la cámara: ' + err;
    });

  </script>

</body>
</html>
